<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for natural depth -->
    <linearGradient id="leaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#96D48A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#68B55E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8DD482;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FA857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BCD97E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#77B36E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="branch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BAA68;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B8A4B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Soft glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for better visibility -->
  <circle cx="50" cy="50" r="48" fill="#F0F9F0" opacity="0.95"/>
  
  <!-- Gentle curved branch -->
  <path d="M 30 70 Q 40 60, 45 50 Q 48 42, 50 35 Q 52 28, 55 20 Q 58 10, 65 5" 
        stroke="url(#branch)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.9"
        filter="url(#glow)"/>
  
  <!-- Left leaf cluster (lower) -->
  <g opacity="0.95">
    <!-- Large leaf -->
    <ellipse cx="35" cy="55" rx="8" ry="14" 
             fill="url(#leaf1)" 
             transform="rotate(-35 35 55)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="35" y1="48" x2="35" y2="62" 
          stroke="#77B36E" 
          stroke-width="0.5" 
          opacity="0.6"
          transform="rotate(-35 35 55)"/>
  </g>
  
  <!-- Right leaf cluster (lower) -->
  <g opacity="0.92">
    <!-- Large leaf -->
    <ellipse cx="53" cy="48" rx="7" ry="13" 
             fill="url(#leaf2)" 
             transform="rotate(25 53 48)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="53" y1="42" x2="53" y2="54" 
          stroke="#68B55E" 
          stroke-width="0.5" 
          opacity="0.5"
          transform="rotate(25 53 48)"/>
  </g>
  
  <!-- Left leaf cluster (middle) -->
  <g opacity="0.94">
    <!-- Medium leaf -->
    <ellipse cx="42" cy="42" rx="6.5" ry="11" 
             fill="url(#leaf3)" 
             transform="rotate(-45 42 42)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="42" y1="37" x2="42" y2="47" 
          stroke="#8BAA68" 
          stroke-width="0.4" 
          opacity="0.5"
          transform="rotate(-45 42 42)"/>
  </g>
  
  <!-- Right leaf cluster (middle) -->
  <g opacity="0.93">
    <!-- Medium leaf -->
    <ellipse cx="57" cy="32" rx="6" ry="10" 
             fill="url(#leaf1)" 
             transform="rotate(35 57 32)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="57" y1="27" x2="57" y2="37" 
          stroke="#77B36E" 
          stroke-width="0.4" 
          opacity="0.5"
          transform="rotate(35 57 32)"/>
  </g>
  
  <!-- Left leaf cluster (upper) -->
  <g opacity="0.91">
    <!-- Small leaf -->
    <ellipse cx="49" cy="25" rx="5" ry="8" 
             fill="url(#leaf2)" 
             transform="rotate(-40 49 25)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="49" y1="21" x2="49" y2="29" 
          stroke="#68B55E" 
          stroke-width="0.3" 
          opacity="0.5"
          transform="rotate(-40 49 25)"/>
  </g>
  
  <!-- Right leaf cluster (upper) -->
  <g opacity="0.90">
    <!-- Small leaf -->
    <ellipse cx="62" cy="15" rx="4.5" ry="7.5" 
             fill="url(#leaf3)" 
             transform="rotate(30 62 15)"
             filter="url(#glow)"/>
    <!-- Vein -->
    <line x1="62" y1="11" x2="62" y2="19" 
          stroke="#8BAA68" 
          stroke-width="0.3" 
          opacity="0.5"
          transform="rotate(30 62 15)"/>
  </g>
  
  <!-- Tiny top leaves -->
  <ellipse cx="58" cy="12" rx="3" ry="5" 
           fill="url(#leaf1)" 
           transform="rotate(-25 58 12)"
           opacity="0.85"/>
  
  <ellipse cx="67" cy="8" rx="2.5" ry="4.5" 
           fill="url(#leaf2)" 
           transform="rotate(20 67 8)"
           opacity="0.85"/>
  
  <!-- Light sparkles for a magical touch -->
  <circle cx="40" cy="50" r="1.5" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="25" r="1.2" fill="#FFFFFF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="38" r="1" fill="#BCD97E" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

